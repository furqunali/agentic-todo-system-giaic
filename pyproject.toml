[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-todo-system"
version = "0.1.0"
description = "A Flask-backed task domain with reusable validation, querying, prioritization, and workload analytics."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Furqan Ali" }]
dependencies = ["Flask>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["todo_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
